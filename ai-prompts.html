<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"/>
<title>AI 图片风格口令 | 拼豆图纸生成器</title>
<meta name="description" content="预览 AI 图片风格效果，一键复制提示词。"/>
<style>
:root{--bg:#f2f3f6;--text:#202938;--sub:#8a96a8;--primary:#1675ec;--card:#fff;--border:#e2eaf4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px;padding:10px 16px}
.back-btn{width:36px;height:36px;border-radius:50%;border:none;background:#eef1f5;color:#444;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.header .brand{font-weight:600;font-size:15px}
.hero{text-align:center;padding:24px 16px 8px}
.hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.hero p{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.65;max-width:720px;margin-left:auto;margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:20px 16px 60px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border-radius:16px;border:1px solid #eef0f4;overflow:hidden;box-shadow:0 2px 10px rgba(30,40,60,.05);display:flex;flex-direction:column}
.card-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:3px 8px;border-radius:6px;z-index:5}
.compare{position:relative;aspect-ratio:1;overflow:hidden;background:#eef0f4}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.compare .eff{clip-path:inset(0 0 0 50%)}
.compare .divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.3);transform:translateX(-1px);pointer-events:none}
.compare .handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:14px;pointer-events:none;border:2px solid var(--primary);color:var(--primary)}
.card-body{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-body h3{font-size:14px;font-weight:600;line-height:1.4}
.card-body .desc{font-size:12px;color:var(--sub);line-height:1.55;flex:1}
.copy-btn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.copy-btn:hover{opacity:.9}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#202938;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:60px 20px;color:var(--sub)}
.spinner{width:30px;height:30px;border:3px solid #dbe4ee;border-top-color:var(--primary);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){.grid{grid-template-columns:1fr;padding:14px 12px 60px}}
</style>
</head>
<body>
<div class="header">
  <button class="back-btn" onclick="history.back()" aria-label="返回">←</button>
  <div class="brand">草莓拼豆 · AI 口令</div>
</div>

<div class="hero">
  <h1>AI 图片风格口令</h1>
  <p>选择一种风格查看原图和效果对比，复制口令打开豆包使用指令即可（图片如果不是像素图建议您通过AI 转换以后更适合拼豆）</p>
</div>

<div id="content"><div class="loading"><div class="spinner"></div>AI 图片风格口令加载中...</div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const content = document.getElementById('content');
const toast = document.getElementById('toast');
let toastTimer=null;
function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2200); }

async function copyText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); showToast('口令已复制'); return; }
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); showToast('口令已复制'); }catch(e){ showToast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  }catch(e){ showToast('复制失败'); }
}

/* 对比滑杆 */
function initCompare(card){
  const eff=card.querySelector('.eff');
  const div=card.querySelector('.divider');
  const handle=card.querySelector('.handle');
  const update=pos=>{
    pos=Math.max(0,Math.min(100,pos));
    eff.style.clipPath='inset(0 0 0 '+pos+'%)';
    div.style.left=pos+'%';
    handle.style.left=pos+'%';
  };
  card.addEventListener('mousemove',e=>{
    const r=card.getBoundingClientRect();
    update((e.clientX-r.left)/r.width*100);
  });
  card.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    const r=card.getBoundingClientRect();
    update((t.clientX-r.left)/r.width*100);
  },{passive:true});
  card.addEventListener('mouseleave',()=>update(50));
}

function renderStyles(styles){
  if(!styles || !styles.length){ content.innerHTML='<div class="loading">暂无口令数据</div>'; return; }
  content.innerHTML='';
  const grid=document.createElement('div');
  grid.className='grid';
  styles.forEach(s=>{
    const badge=s.name.match(/强烈推荐/)?'<span class="card-badge">🔥 推荐</span>':'';
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=
      '<div class="compare" style="position:relative">'+badge+
        '<img class="orig" src="'+s.originalImage+'" alt="原图" loading="lazy"/>'+
        '<img class="eff" src="'+s.effectImage+'" alt="效果" loading="lazy"/>'+
        '<div class="divider"></div><div class="handle">◀▶</div>'+
      '</div>'+
      '<div class="card-body">'+
        '<h3>'+s.name+'</h3>'+
        '<p class="desc">'+(s.description||'')+'</p>'+
        '<button class="copy-btn" data-prompt="">复制口令</button>'+
      '</div>';
    const btn=card.querySelector('.copy-btn');
    btn.dataset.prompt=s.prompt||'';
    btn.addEventListener('click',()=>copyText(btn.dataset.prompt));
    initCompare(card);
    grid.appendChild(card);
  });
  content.appendChild(grid);
}

"id":"prompt-style-1785984273324-22yn9","name":"宠物 Q 版卡通化（强烈推荐）","description":"强烈推荐！（适合宠物狗狗猫等宠物）原照片转 Q 版卡通化适合拼豆的像素图指令，适应大部分拼豆玩家拼的风格，解决原图大没法拼豆的问题，风格偏可爱 Q 版。","prompt":"masterpiece,best quality,pixel art,8bit pixel,复古纯色块像素Q萌宠物画风,Q版萌系比例，大头小身子，脑袋圆润偏大、四肢短小迷你，整体软萌体态，在参考宠物原生特征基础上做可爱Q版变形，保留原有品种五官特征，超粗黑色加粗外轮廓线，全宠物边缘厚重黑边粗描边，单只宠物头部/半身Q版特写，构图紧凑、画面上下留白适中，纯白色纯空白背景、无任何背景杂物，还原原参考宠物五官、耳朵、口鼻、胡须、斑纹特征，宠物原有天生毛色配色，平涂色块上色、无渐变光影、均匀像素颗粒，严格复刻参考图片宠物原生斑纹与品种特征，Q版圆润身体轮廓、软乎乎体态结构、原版毛发配色、原宠物五官细节、短圆小爪垫，纯色像素块，干净纯色平涂，软萌可爱画风。","originalImage":"ai-img/original-fbbedb48-c7fb-4d3a-8f8a-023fa53d98c8.jpg","effectImage":"ai-img/effect-7306e7b8-11f8-4a66-a373-8e0fb645614d.jpg","enabled":true},{"id":"prompt-style-1785982161834-27ui1","name":"照片转像素图（带背景版）","description":"照片直接做拼豆图纸优化照片指令，去背景同时去除原照片的渐变颜色，让颜色像素块化，适合想要直接拼照片的玩家。（适合老玩家 因为图纸不能做太小，原图太大 小板像素较低）","prompt":"把这张照片转为“像素风”保留背景，色彩使用纯色块。","originalImage":"ai-img/original-0035d42b-6312-4274-b34d-ac0a9890f9d6.jpg","effectImage":"ai-img/effect-68d136d1-91e2-4f14-8774-f49d3cba9d80.jpg","enabled":true}]};
renderStyles(PROMPT_DATA.styles);
</script>

</html>
